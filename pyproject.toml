[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "llm-sdk",
    "numpy",
    "pydantic",
]
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]
[tool.uv.sources]
llm-sdk = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true